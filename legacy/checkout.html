<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · BiteX</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar">
<a href="index.html" class="logo">
<svg class="logo-mark" width="32" height="32" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="17" cy="17" r="15" fill="url(#biteGrad)"/>
<circle cx="25" cy="9" r="7.5" fill="#181220"/>
<path d="M24 5 L25.6 8 L28.8 6.4 L27 9.4 L30 10.6 L26.6 11.4 L27 14.6 L24.7 12.2 L22.3 14.6 L22.7 11.4 L19.4 10.6 L22.4 9.4 L20.6 6.4 Z" fill="#FF3D57"/>
<defs>
<linearGradient id="biteGrad" x1="2" y1="2" x2="32" y2="32" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFB648"/>
<stop offset="1" stop-color="#FF5A36"/>
</linearGradient>
</defs>
</svg>
<span>Bite<span class="accent-x">X</span></span>
<span class="version-pill">3.0</span>
</a>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="restaurants.html">Restaurants</a>
<a href="favorites.html">Favorites</a>
<a href="orders.html">Orders</a>
<a href="cart.html">Cart <span class="cart-badge">0</span></a>
<a href="profile.html">Profile</a>
</div>
</nav>

<div class="checkout-box">

<form class="form-box glass" onsubmit="placeOrder(event)">

<h2 style="margin-bottom:25px;">Delivery Details</h2>

<input type="text" placeholder="Full Name" required>
<input type="text" placeholder="Address" required>
<input type="text" placeholder="Phone Number" required>

<button type="submit" class="btn btn-primary auth-btn">Place Order</button>

</form>

<div class="summary glass">
<h2>Payment</h2>
<div class="summary-row"><span>UPI</span><span>✔</span></div>
<div class="summary-row"><span>Card</span><span>✔</span></div>
<div class="summary-row"><span>Cash</span><span>✔</span></div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
