<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · BiteX</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar">
<a href="index.html" class="logo">
<svg class="logo-mark" width="32" height="32" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="17" cy="17" r="15" fill="url(#biteGrad)"/>
<circle cx="25" cy="9" r="7.5" fill="#181220"/>
<path d="M24 5 L25.6 8 L28.8 6.4 L27 9.4 L30 10.6 L26.6 11.4 L27 14.6 L24.7 12.2 L22.3 14.6 L22.7 11.4 L19.4 10.6 L22.4 9.4 L20.6 6.4 Z" fill="#FF3D57"/>
<defs>
<linearGradient id="biteGrad" x1="2" y1="2" x2="32" y2="32" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFB648"/>
<stop offset="1" stop-color="#FF5A36"/>
</linearGradient>
</defs>
</svg>
<span>Bite<span class="accent-x">X</span></span>
<span class="version-pill">3.0</span>
</a>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="restaurants.html">Restaurants</a>
<a href="favorites.html">Favorites</a>
<a href="orders.html">Orders</a>
<a href="cart.html">Cart <span class="cart-badge">0</span></a>
<a href="profile.html">Profile</a>
</div>
</nav>

<div class="profile-box">

<div class="profile-header glass">
<div class="avatar">S</div>
<div>
<h2>Sam Vishwa</h2>
<p class="muted">sam.vishwa@example.com</p>
</div>
</div>

<div class="glass" style="padding:30px; border-radius:28px; margin-bottom:24px;">
<h3 style="margin-bottom:20px;">Account Details</h3>
<div class="profile-grid">
<div class="profile-field">
<label>Full Name</label>
<input type="text" value="Sam Vishwa">
</div>
<div class="profile-field">
<label>Email</label>
<input type="email" value="sam.vishwa@example.com">
</div>
<div class="profile-field">
<label>Phone</label>
<input type="text" value="+91 98765 43210">
</div>
<div class="profile-field">
<label>Address</label>
<input type="text" value="12, MG Road, Chennai">
</div>
</div>
<button class="btn btn-primary" style="margin-top:10px;" onclick="showToast('Profile saved')">Save Changes</button>
</div>

<div class="glass" style="padding:30px; border-radius:28px;">
<h3 style="margin-bottom:10px;">Preferences</h3>

<div class="settings-row">
<div>
<strong>Order Notifications</strong>
<p class="muted">Get updates on order status</p>
</div>
<div class="switch on" onclick="this.classList.toggle('on')"></div>
</div>

<div class="settings-row">
<div>
<strong>Promotional Emails</strong>
<p class="muted">Offers, discounts and news</p>
</div>
<div class="switch" onclick="this.classList.toggle('on')"></div>
</div>

<div class="settings-row">
<div>
<strong>Save Payment Info</strong>
<p class="muted">Faster checkout next time</p>
</div>
<div class="switch on" onclick="this.classList.toggle('on')"></div>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
